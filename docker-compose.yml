services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: findr
      POSTGRES_PASSWORD: findr
      POSTGRES_DB: findr
    ports:
      - "5432:5432"
    volumes:
      - findr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findr -d findr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  findr_pgdata:
